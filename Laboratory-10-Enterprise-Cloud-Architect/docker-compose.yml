# =============================================================================
# CloudNova Technologies - Enterprise Cloud Architect
# Multi-tier stack: Ghost (web/app tier) + PostgreSQL (data tier)
# Persistent volumes ensure data survives VM reboots and container recreation.
# =============================================================================

services:

  db:
    image: postgres:16-alpine
    container_name: cloudnova_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: ghost:5-alpine
    container_name: cloudnova_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:2368"
    environment:
      url: http://localhost:3000
      database__client: pg
      database__connection__host: db
      database__connection__port: 5432
      database__connection__database: ${POSTGRES_DB}
      database__connection__user: ${POSTGRES_USER}
      database__connection__password: ${POSTGRES_PASSWORD}
    volumes:
      - ghost_content:/var/lib/ghost/content
    networks:
      - backend
      - frontend

volumes:
  pg_data:
    driver: local
  ghost_content:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
